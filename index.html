    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-dark: #0d0618;
            --bg-purple: #1a0b2e;
            --purple-deep: #2d1b4e;
            --purple-mid: #4a2c7a;
            --pink-accent: #e891b8;
            --pink-soft: #f5c0d8;
            --pink-glow: rgba(232, 145, 184, 0.35);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-strong: rgba(255, 255, 255, 0.1);
            --text-main: #f8eef5;
            --text-soft: #c9b0d4;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 48px rgba(232, 145, 184, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-dark);
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(74, 44, 122, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(232, 145, 184, 0.15) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 50%, rgba(45, 27, 78, 0.3) 0%, transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }


        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4.3rem;
            z-index: 90;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-bottom: 1px solid transparent;
            transition: background 0.3s ease, backdrop-filter 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            pointer-events: none;
        }

        .header-bar.scrolled {
            background: rgba(26, 11, 46, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(232, 145, 184, 0.2);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        }

        .site-name {
            position: fixed;
            top: 1.2rem;
            left: 1.6rem;
            z-index: 100;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s ease;
            text-shadow: 0 0 20px var(--pink-glow);
        }

        .site-name:hover {
            color: var(--pink-accent);
        }

        .logo {
            position: fixed;
            top: 1.15rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.85rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--text-main);
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 0 0 24px var(--pink-glow);
        }

        .ig-wrap {
            position: fixed;
            top: 1.2rem;
            right: 1.6rem;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .flower {
            font-size: 1.2rem;
            display: inline-block;
            transition: transform 0.25s ease;
            cursor: default;
            user-select: none;
            line-height: 1;
            filter: drop-shadow(0 0 6px var(--pink-glow));
        }

        .ig-wrap:hover .flower:nth-child(1) {
            transform: scale(1.25) rotate(-90deg);
        }

        .ig-wrap:hover .flower:nth-child(3) {
            transform: scale(1.25) rotate(90deg);
        }

        .ig-btn {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.8rem 1.45rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: var(--shadow);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .ig-btn:hover {
            background: rgba(232, 145, 184, 0.25);
            border-color: var(--pink-accent);
            transform: translateY(-2px);
        }

        .ig-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .top-divider {
            position: fixed;
            top: 4.15rem;
            left: 0;
            right: 0;
            height: 1px;
            z-index: 99;
            background: linear-gradient(90deg, transparent 8%, var(--purple-mid) 25%, var(--pink-accent) 50%, var(--purple-mid) 75%, transparent 92%);
            box-shadow: 0 3px 16px var(--pink-glow);
            pointer-events: none;
        }

        main {
            position: relative;
            z-index: 5;
            max-width: 1400px;
            margin: 0 auto;
            padding: 5.5rem 1.5rem 4rem;
        }

        .albums-section {
            margin-bottom: 3.5rem;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.75rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: var(--pink-soft);
            text-align: center;
            margin-bottom: 1.8rem;
            text-shadow: 0 0 20px var(--pink-glow);
        }

        .albums-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .album-card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            aspect-ratio: 4 / 3;
        }

        .album-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: var(--pink-accent);
        }

        .album-cover {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transition: transform 0.35s ease;
            filter: brightness(0.75);
        }

        .album-card:hover .album-cover img {
            transform: scale(1.08);
            filter: brightness(0.9);
        }

        .album-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.4rem 1.3rem;
            background: linear-gradient(to top, rgba(13, 6, 24, 0.92) 0%, rgba(13, 6, 24, 0.6) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .album-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--text-main);
        }

        .album-count {
            font-size: 0.9rem;
            color: var(--pink-soft);
            font-weight: 300;
        }

        .album-icon {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 42px;
            height: 42px;
            background: var(--glass-strong);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .gallery-section {
            margin-top: 1rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .card {
            position: relative;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(232, 145, 184, 0.4);
        }

        .card-img-wrap {
            position: relative;
            width: 100%;
            padding-top: 130%;
            overflow: hidden;
            background: var(--purple-deep);
        }

        .card-img-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transition: transform 0.3s ease;
        }

        .card:hover .card-img-wrap img {
            transform: scale(1.04);
        }

        .album-view {
            display: none;
            margin-bottom: 2rem;
        }

        .album-view.active {
            display: block;
        }

        .album-view-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding: 1rem 1.3rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
        }

        .album-view-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--pink-soft);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.1rem;
            background: var(--glass-strong);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(232, 145, 184, 0.2);
            border-color: var(--pink-accent);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            background: linear-gradient(135deg, rgba(232, 145, 184, 0.35), rgba(74, 44, 122, 0.5));
            border: 1px solid var(--pink-accent);
            border-radius: 50px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 16px rgba(232, 145, 184, 0.2);
        }

        .download-btn:hover {
            background: linear-gradient(135deg, rgba(232, 145, 184, 0.5), rgba(74, 44, 122, 0.65));
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(232, 145, 184, 0.35);
        }

        .pack-info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1.2rem 1.4rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
        }

        .pack-info-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-weight: 500;
            color: var(--pink-soft);
        }

        .pack-info-desc {
            font-size: 0.9rem;
            color: var(--text-soft);
            margin-top: 0.25rem;
        }


        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 4, 16, 0.92);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            max-width: 92vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 2.2rem;
            cursor: pointer;
            line-height: 1;
            padding: 0.2rem 0.5rem;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .lightbox-close:hover {
            opacity: 1;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }

        .lightbox-nav:hover {
            background: rgba(232, 145, 184, 0.3);
        }

        .lightbox-prev { left: 16px; }
        .lightbox-next { right: 16px; }

        .contact {
            text-align: center;
            margin-top: 3rem;
            padding-bottom: 2rem;
            color: var(--text-soft);
            font-size: 0.95rem;
        }

        .contact a {
            color: var(--pink-accent);
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        @media (max-width: 1100px) {
            .albums-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 1.2rem;
                top: 4.2rem;
                left: 50%;
            }
            .site-name {
                font-size: 1.5rem;
                left: 1rem;
            }
            .ig-wrap {
                right: 1rem;
            }
            .ig-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
            .albums-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.9rem;
            }
            main {
                padding: 7rem 1rem 3rem;
            }
            .lightbox-nav {
                width: 40px;
                height: 40px;
                font-size: 1.6rem;
            }
            .lightbox-prev { left: 8px; }
            .lightbox-next { right: 8px; }
            .album-name {
                font-size: 1.25rem;
            }
            .header-bar {
                height: 5.5rem;
            }
        }
    </style>
</head>

            'images/NG-Anime-Artist-artist-Anime-7610841.jpg',
            'images/NG-Anime-Artist-artist-Anime-7761954.jpg',
            'images/NG-Anime-Artist-artist-AO-7568441.jpg',
            'images/NG-Anime-Artist-artist-AO-7732135.jpg',
            'images/NG-Anime-Artist-artist-AO-7778332.jpg',
            'images/NG-Anime-Artist-artist-AO-7905368.jpg',
            'images/NG-Anime-Artist-artist-AO-8005631.jpg',
            'images/NG-Anime-Artist-artist-Anime-6308617.jpg',
            'images/NG-Anime-Artist-artist-Anime-6375972.jpg',
            'images/NG-Anime-Artist-artist-Anime-6410677.jpg',
            'images/NG-Anime-Artist-artist-Anime-6910720.jpg',
            'images/NG-Anime-Artist-artist-Anime-Ero-7223183.jpg',
            'images/NG-Anime-Artist-artist-AO-7409371.jpg',
            'images/NG-Anime-Artist-artist-AO-7614787.jpg',
            'images/Oshiri-Anime-Ero-Anime-Adult-Pantsu-7132301.jpg'
        ];

        const album1Images = images.slice(9);
        const album2Images = images.slice(0, 9);
        const album3Images = [
            'images/mc-girls-1.jpg',
            'images/mc-girls-2.jpg'
        ];

        let currentIndex = 0;
        let currentGallery = images;

        function buildGallery(containerId, srcs) {
            const container = document.getElementById(containerId);
            const frag = document.createDocumentFragment();
            srcs.forEach((src, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                card.innerHTML = '<div class="card-img-wrap"><img src="' + src + '" alt="" loading="lazy" decoding="async"></div>';
                card.addEventListener('click', function() {
                    currentIndex = i;
                    currentGallery = srcs;
                    openLightbox();
                });
                frag.appendChild(card);
            });
            container.appendChild(frag);
        }

        buildGallery('gallery', images);
        buildGallery('gallery-album-1', album1Images);
        buildGallery('gallery-album-2', album2Images);
        buildGallery('gallery-album-3', album3Images);

        function openAlbum(num) {
            document.getElementById('albums').style.display = 'none';
            document.getElementById('all-photos').style.display = 'none';
            document.getElementById('album-view-1').classList.remove('active');
            document.getElementById('album-view-2').classList.remove('active');
            document.getElementById('album-view-3').classList.remove('active');
            document.getElementById('album-view-' + num).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeAlbum() {
            document.getElementById('album-view-1').classList.remove('active');
            document.getElementById('album-view-2').classList.remove('active');
            document.getElementById('album-view-3').classList.remove('active');
            document.getElementById('albums').style.display = 'block';
            document.getElementById('all-photos').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        function openLightbox() {
            lightboxImg.src = currentGallery[currentIndex];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            lightboxImg.src = '';
        }

        document.getElementById('closeBtn').addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) closeLightbox();
        });

        document.getElementById('prevBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
            lightboxImg.src = currentGallery[currentIndex];
        });

        document.getElementById('nextBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % currentGallery.length;
            lightboxImg.src = currentGallery[currentIndex];
        });

        document.addEventListener('keydown', function(e) {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') {
                currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
                lightboxImg.src = currentGallery[currentIndex];
            }
            if (e.key === 'ArrowRight') {
                currentIndex = (currentIndex + 1) % currentGallery.length;
                lightboxImg.src = currentGallery[currentIndex];
            }
        });

        // Header turns purple on scroll
        const headerBar = document.getElementById('headerBar');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 20) {
                headerBar.classList.add('scrolled');
            } else {
                headerBar.classList.remove('scrolled');
            }
        }, { passive: true });

    </script>
</body>
</html>
